name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'prep/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo khung Android nếu repo chưa có
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/keep
            cp -r lib assets pubspec.yaml analysis_options.yaml /tmp/keep/
            flutter create --platforms=android --org vn.duongtoitrangnguyen --project-name duong_toi_trang_nguyen .
            cp -rf /tmp/keep/. .
            rm -rf test
          fi
          sed -i 's|android:label="[^"]*"|android:label="Đường Tới Trạng Nguyên"|' android/app/src/main/AndroidManifest.xml
          # Quyền mạng (chỉ để kiểm tra bản cập nhật), bản release mặc định không có.
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Gắn icon app
        run: cp -r prep/icon/res/* android/app/src/main/res/

      - name: Dùng khóa ký cố định (để cài đè được lên bản cũ)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          # Ép Gradle ký bản release bằng đúng khóa này (không phụ thuộc vị trí mặc định).
          {
            echo ""
            echo "android.injected.signing.store.file=$GITHUB_WORKSPACE/keystore/debug.keystore"
            echo "android.injected.signing.store.password=android"
            echo "android.injected.signing.key.alias=androiddebugkey"
            echo "android.injected.signing.key.password=android"
          } >> android/gradle.properties

      - name: Tải thư viện
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Kiểm tra chữ ký APK (phải là 62:CD:F0:12...)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee sig.txt
          grep -qi "62cdf012dbf82c5f" sig.txt

      - name: Đổi tên APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DuongToiTrangNguyen.apk

      - name: Lưu APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuongToiTrangNguyen-apk
          path: DuongToiTrangNguyen.apk

      - name: Đăng APK lên mục Releases (tải thẳng trên điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: DuongToiTrangNguyen.apk
